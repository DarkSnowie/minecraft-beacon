<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Beacon</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <h1>⛏</h1>

            <h2>Beacon</h2>

        </div>

        <nav>

            <button class="active">
                🏠 Dashboard
            </button>

            <button>
                🏆 Achievements
            </button>

            <button>
                🌾 Farms
            </button>

            <button>
                📀 Collections
            </button>

            <button>
                👨 Villagers
            </button>

            <button>
                📝 Notes
            </button>

            <button>
                ⚙ Settings
            </button>

        </nav>

    </aside>

    <main>

        <header>

            <h1>Dashboard</h1>

            <p>
                Welcome to Minecraft Beacon
            </p>

        </header>

        <section class="dashboard-grid">

            <div class="card">

                <h3>Achievements</h3>

                <h2>0 / 133</h2>

            </div>

            <div class="card">

                <h3>Today's Goals</h3>

                <ul>

                    <li>Build Starter House</li>

                    <li>Mine Iron</li>

                    <li>Find Village</li>

                </ul>

            </div>

            <div class="card">

                <h3>Current Phase</h3>

                <p>Early Game</p>

            </div>

            <div class="card">

                <h3>Statistics</h3>

                <p>Coming Soon...</p>

            </div>

        </section>

    </main>

</div>

<script type="module" src="assets/js/app.js"></script>

</body>
</html>
